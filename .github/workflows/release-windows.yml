name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Prepare single draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "码迹 $version" --notes-file "docs/releases/$version.md" --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Failed to prepare release draft" }
          }

      - name: Build and upload GitHub Release assets
        run: npm run package:release
        env:
          MAJI_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify assets and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Failed to read release assets" }
          foreach ($name in @("latest.yml", "maji-setup-$version-x64.exe", "maji-setup-$version-x64.exe.blockmap")) {
            if ($assets -notcontains $name) { throw "Missing release asset: $name" }
          }
          gh release edit $tag --draft=false --latest --title "码迹 $version" --notes-file "docs/releases/$version.md" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release" }
